<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuaderno de Tutoría - Aula Ratones</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Iconos Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 font-sans min-h-screen text-slate-800 flex flex-col justify-between max-w-md mx-auto relative shadow-2xl border-x border-slate-200">

  <!-- ==================== PANTALLA 1: LOGIN ==================== -->
  <div id="loginScreen" class="absolute inset-0 bg-indigo-600 z-50 flex flex-col items-center justify-center p-6 text-white">
    <div class="w-24 h-24 bg-white/20 rounded-full flex items-center justify-center mb-4 backdrop-blur-sm border-2 border-white/30 shadow-lg">
      <i data-lucide="user" class="w-12 h-12 text-white"></i>
    </div>
    <h1 class="text-2xl font-bold mb-1">¡Hola, Profe! 👋</h1>
    <p class="text-indigo-200 text-sm mb-6">Aula Ratones</p>

    <div class="w-full max-w-xs space-y-3">
      <input type="password" id="passwordInput" placeholder="Introduce tu contraseña" 
             class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-indigo-200 text-center text-lg focus:outline-none focus:ring-2 focus:ring-white">
      
      <button onclick="checkPassword()" 
              class="w-full bg-white text-indigo-600 font-semibold py-3 rounded-xl shadow-lg hover:bg-indigo-50 active:scale-95 transition">
        Entrar
      </button>
      <p id="errorMsg" class="text-xs text-rose-300 text-center hidden font-medium">Contraseña incorrecta.</p>
    </div>
  </div>

  <!-- ==================== PANTALLA 2: DASHBOARD PRINCIPAL ==================== -->
  <div id="mainApp" class="hidden flex-1 flex flex-col p-4 space-y-4">
    
    <!-- Encabezado con Ajustes -->
    <header class="flex justify-between items-center bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center font-bold">
          🐭
        </div>
        <div>
          <h2 class="font-bold text-slate-800 leading-tight">Aula Ratones</h2>
          <p class="text-xs text-slate-400">Cuaderno de Tutoría</p>
        </div>
      </div>
      <button onclick="openSection('Ajustes')" class="p-2 text-slate-400 hover:text-indigo-600 hover:bg-slate-50 rounded-xl transition">
        <i data-lucide="settings" class="w-6 h-6"></i>
      </button>
    </header>

    <!-- Calendario Mensual Principal -->
    <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex-1 flex flex-col justify-between">
      <div class="flex justify-between items-center mb-3">
        <button onclick="changeMonth(-1)" class="p-1.5 hover:bg-slate-100 rounded-lg text-slate-600"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>
        <h3 id="calendarMonth" class="font-bold text-slate-700 capitalize"></h3>
        <button onclick="changeMonth(1)" class="p-1.5 hover:bg-slate-100 rounded-lg text-slate-600"><i data-lucide="chevron-right" class="w-5 h-5"></i></button>
      </div>

      <div class="grid grid-cols-7 text-center text-xs font-semibold text-slate-400 mb-2">
        <span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span><span>D</span>
      </div>

      <div id="calendarDays" class="grid grid-cols-7 gap-1 text-center text-sm font-medium flex-1 items-center"></div>
    </section>

    <!-- Menú de Botones Cuadrados -->
    <footer class="grid grid-cols-2 gap-3 pt-1">
      <button onclick="openSection('Alumnos')" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center space-y-2 hover:border-indigo-300 hover:shadow-md active:scale-95 transition group">
        <div class="p-3 bg-blue-50 text-blue-600 rounded-xl group-hover:scale-110 transition">
          <i data-lucide="users" class="w-6 h-6"></i>
        </div>
        <span class="font-semibold text-sm text-slate-700">Alumnos</span>
      </button>

      <button onclick="openSection('Evaluación')" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center space-y-2 hover:border-indigo-300 hover:shadow-md active:scale-95 transition group">
        <div class="p-3 bg-emerald-50 text-emerald-600 rounded-xl group-hover:scale-110 transition">
          <i data-lucide="clipboard-check" class="w-6 h-6"></i>
        </div>
        <span class="font-semibold text-sm text-slate-700">Evaluación</span>
      </button>

      <button onclick="openSection('Tutorías')" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center space-y-2 hover:border-indigo-300 hover:shadow-md active:scale-95 transition group">
        <div class="p-3 bg-purple-50 text-purple-600 rounded-xl group-hover:scale-110 transition">
          <i data-lucide="calendar-heart" class="w-6 h-6"></i>
        </div>
        <span class="font-semibold text-sm text-slate-700">Tutorías</span>
      </button>

      <button onclick="openSection('Programación')" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center space-y-2 hover:border-indigo-300 hover:shadow-md active:scale-95 transition group">
        <div class="p-3 bg-amber-50 text-amber-600 rounded-xl group-hover:scale-110 transition">
          <i data-lucide="book-open" class="w-6 h-6"></i>
        </div>
        <span class="font-semibold text-sm text-slate-700">Programación</span>
      </button>
    </footer>
  </div>

  <!-- ==================== VISTA MODAL / SECCIÓN ABIERTA ==================== -->
  <div id="sectionModal" class="hidden absolute inset-0 bg-white z-40 flex flex-col p-4 overflow-hidden">
    <div class="flex items-center justify-between pb-3 border-b border-slate-100 mb-3 shrink-0">
      <button onclick="closeSection()" class="flex items-center text-sm font-semibold text-slate-500 hover:text-indigo-600">
        <i data-lucide="arrow-left" class="w-5 h-5 mr-1"></i> Volver
      </button>
      <h3 id="modalTitle" class="font-bold text-lg text-slate-800"></h3>
      <div class="w-5"></div>
    </div>
    <div id="modalContent" class="flex-1 overflow-y-auto"></div>
  </div>

  <!-- Modal para Subir Foto de Alumno -->
  <div id="uploadModal" class="hidden absolute inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end justify-center p-4">
    <div class="bg-white w-full rounded-2xl p-4 space-y-3 shadow-xl">
      <div class="flex justify-between items-center pb-2 border-b">
        <h4 id="uploadCategoryTitle" class="font-bold text-slate-800 text-sm"></h4>
        <button onclick="closeUploadModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <input type="file" id="photoInput" accept="image/*" class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-600 hover:file:bg-indigo-100">
      <textarea id="photoComment" placeholder="Escribe un comentario sobre esta imagen..." class="w-full p-3 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-indigo-500 outline-none h-20 resize-none"></textarea>
      <button onclick="processAndSavePhoto()" class="w-full bg-indigo-600 text-white font-semibold py-2.5 rounded-xl text-xs hover:bg-indigo-700 transition">Guardar en Galería</button>
    </div>
  </div>

  <!-- Modal para Detalle y Comentarios de Tutoría -->
  <div id="tutoriaDetailModal" class="hidden absolute inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end justify-center p-4">
    <div class="bg-white w-full rounded-2xl p-4 space-y-3 shadow-xl">
      <div class="flex justify-between items-center pb-2 border-b">
        <div>
          <h4 id="tutoriaModalTitle" class="font-bold text-slate-800 text-sm"></h4>
          <p id="tutoriaModalDate" class="text-[10px] text-slate-400"></p>
        </div>
        <button onclick="closeTutoriaDetailModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      
      <textarea id="tutoriaModalNotes" placeholder="Escribe aquí los comentarios, pautas y acuerdos alcanzados en la tutoría..." class="w-full p-3 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-purple-500 outline-none h-36 resize-none"></textarea>

      <div class="flex gap-2">
        <button onclick="deleteTutoria()" class="bg-rose-50 text-rose-600 p-2.5 rounded-xl text-xs font-semibold hover:bg-rose-100 transition flex items-center justify-center">
          <i data-lucide="trash-2" class="w-4 h-4"></i>
        </button>
        <button onclick="saveTutoriaNotes()" class="flex-1 bg-purple-600 text-white font-semibold py-2.5 rounded-xl text-xs hover:bg-purple-700 transition">
          Guardar Comentarios
        </button>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();

    const studentsList = [
      "1. A.A.M", "2. A.A.H", "3. G.B.C", "4. D.B.C", "5. T.G.E", "6. E.G.S",
      "7. A.G.G", "8. L.I.S", "9. Q", "10. E.M.F", "11. L.N.G", "12. V.P.O",
      "13. L.P.N", "14. V.R.M", "15. H.R.M", "16. H.S.A", "17. M.S.M", "18. A.V.P"
    ];

    let currentStudent = '';
    let selectedCategory = '';

    function getPassword() { return localStorage.getItem('ratones_pwd') || '1234'; }

    function checkPassword() {
      const pwd = document.getElementById('passwordInput').value;
      if (pwd === getPassword()) {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('mainApp').classList.remove('hidden');
        renderCalendar();
      } else {
        document.getElementById('errorMsg').classList.remove('hidden');
      }
    }

    function logout() {
      document.getElementById('passwordInput').value = '';
      document.getElementById('errorMsg').classList.add('hidden');
      closeSection();
      document.getElementById('mainApp').classList.add('hidden');
      document.getElementById('loginScreen').classList.remove('hidden');
    }

    function updatePassword() {
      const newPwd = document.getElementById('newPwdInput').value.trim();
      if (newPwd) {
        localStorage.setItem('ratones_pwd', newPwd);
        document.getElementById('pwdSuccessMsg').classList.remove('hidden');
        document.getElementById('newPwdInput').value = '';
        setTimeout(() => document.getElementById('pwdSuccessMsg').classList.add('hidden'), 3000);
      }
    }

    // --- CALENDARIO PRINCIPAL ---
    let currentDate = new Date();

    function renderCalendar() {
      const monthText = currentDate.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' });
      document.getElementById('calendarMonth').innerText = monthText;

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const grid = document.getElementById('calendarDays');
      grid.innerHTML = '';

      let startOffset = (firstDay === 0 ? 6 : firstDay - 1);
      for (let i = 0; i < startOffset; i++) { grid.innerHTML += `<div></div>`; }

      const today = new Date();
      for (let day = 1; day <= daysInMonth; day++) {
        const isToday = today.getDate() === day && today.getMonth() === month && today.getFullYear() === year;
        const activeClass = isToday ? 'bg-indigo-600 text-white font-bold rounded-xl shadow-md' : 'text-slate-700 hover:bg-slate-100 rounded-lg';
        grid.innerHTML += `<div class="p-2 cursor-pointer transition ${activeClass}">${day}</div>`;
      }
    }

    function changeMonth(delta) {
      currentDate.setMonth(currentDate.getMonth() + delta);
      renderCalendar();
    }

    // --- NAVEGACIÓN GENERAL ---
    function openSection(name) {
      document.getElementById('modalTitle').innerText = name;
      const content = document.getElementById('modalContent');

      if (name === 'Ajustes') {
        content.innerHTML = `
          <div class="space-y-6 pt-2">
            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200">
              <h4 class="font-bold text-slate-700 mb-2 flex items-center gap-2"><i data-lucide="key" class="w-4 h-4 text-indigo-600"></i> Cambiar Contraseña</h4>
              <input type="password" id="newPwdInput" placeholder="Nueva contraseña" class="w-full p-2.5 border rounded-xl bg-white mb-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
              <button onclick="updatePassword()" class="w-full bg-indigo-600 text-white py-2 rounded-xl text-sm font-semibold hover:bg-indigo-700 transition">Guardar Nueva Contraseña</button>
              <p id="pwdSuccessMsg" class="text-xs text-emerald-600 font-medium text-center mt-2 hidden">¡Contraseña actualizada con éxito!</p>
            </div>
            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200">
              <h4 class="font-bold text-slate-700 mb-2 flex items-center gap-2"><i data-lucide="log-out" class="w-4 h-4 text-rose-500"></i> Sesión</h4>
              <button onclick="logout()" class="w-full bg-rose-500 text-white py-2 rounded-xl text-sm font-semibold hover:bg-rose-600 transition">Cerrar Sesión</button>
            </div>
          </div>`;
      } else if (name === 'Alumnos') {
        let gridHtml = `<div class="grid grid-cols-2 gap-3 pt-1">`;
        studentsList.forEach(student => {
          gridHtml += `
            <button onclick="openStudentDetail('${student}')" class="bg-slate-50 p-4 rounded-2xl border border-slate-200 hover:border-indigo-400 hover:bg-indigo-50/50 flex flex-col items-center justify-center space-y-2 active:scale-95 transition">
              <div class="w-10 h-10 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center font-bold text-sm">
                ${student.split('.')[1] || student.substring(0,2)}
              </div>
              <span class="font-bold text-sm text-slate-800">${student}</span>
            </button>`;
        });
        gridHtml += `</div>`;
        content.innerHTML = gridHtml;
      } else if (name === 'Tutorías') {
        renderTutoriasSection();
      } else {
        content.innerHTML = `
          <div class="flex flex-col items-center justify-center h-64 text-center p-6 bg-slate-50 rounded-2xl border border-dashed border-slate-200">
            <div class="p-4 bg-indigo-50 text-indigo-600 rounded-full mb-3"><i data-lucide="wrench" class="w-8 h-8"></i></div>
            <h4 class="font-bold text-slate-700 mb-1">Sección de ${name}</h4>
            <p class="text-sm text-slate-400">¡Lista para construir!</p>
          </div>`;
      }
      document.getElementById('sectionModal').classList.remove('hidden');
      lucide.createIcons();
    }

    // ==================== MÓDULO DE TUTORÍAS ====================
    let tutoriaDate = new Date();
    let selectedTutoriaDayKey = formatDateKey(new Date());
    let activeTutoriaId = null;

    function formatDateKey(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function getTutorias() {
      return JSON.parse(localStorage.getItem('ratones_tutorias') || '[]');
    }

    function saveTutorias(data) {
      localStorage.setItem('ratones_tutorias', JSON.stringify(data));
    }

    function renderTutoriasSection() {
      const content = document.getElementById('modalContent');
      content.innerHTML = `
        <div class="space-y-4 pb-6">
          
          <!-- Calendario de Tutorías -->
          <div class="bg-slate-50 p-3.5 rounded-2xl border border-slate-200">
            <div class="flex justify-between items-center mb-3">
              <button onclick="changeTutoriaMonth(-1)" class="p-1 hover:bg-slate-200 rounded-lg text-slate-600"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>
              <h4 id="tutoriaCalendarMonth" class="font-bold text-slate-700 capitalize text-sm"></h4>
              <button onclick="changeTutoriaMonth(1)" class="p-1 hover:bg-slate-200 rounded-lg text-slate-600"><i data-lucide="chevron-right" class="w-5 h-5"></i></button>
            </div>

            <div class="grid grid-cols-7 text-center text-[11px] font-semibold text-slate-400 mb-2">
              <span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span><span>D</span>
            </div>

            <div id="tutoriaCalendarDays" class="grid grid-cols-7 gap-1 text-center text-xs font-medium"></div>
          </div>

          <!-- Gestor de Citas para el Día Seleccionado -->
          <div class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm space-y-3">
            <h4 id="selectedDayTitle" class="font-bold text-slate-800 text-xs uppercase tracking-wider"></h4>
            
            <!-- Crear nueva cita -->
            <div class="flex gap-2">
              <input type="text" id="tutoriaTitleInput" placeholder="Ej: Familia Adriana" class="flex-1 p-2 border border-slate-200 rounded-xl text-xs outline-none focus:ring-2 focus:ring-purple-500">
              <button onclick="addTutoriaCita()" class="bg-purple-600 text-white font-semibold px-3 py-2 rounded-xl text-xs hover:bg-purple-700 transition">
                + Añadir
              </button>
            </div>

            <!-- Lista de Citas del Día -->
            <div id="dayCitasList" class="space-y-2 pt-1"></div>
          </div>

        </div>
      `;

      renderTutoriaCalendarGrid();
      renderDayCitas();
      lucide.createIcons();
    }

    function changeTutoriaMonth(delta) {
      tutoriaDate.setMonth(tutoriaDate.getMonth() + delta);
      renderTutoriaCalendarGrid();
    }

    function renderTutoriaCalendarGrid() {
      const monthText = tutoriaDate.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' });
      document.getElementById('tutoriaCalendarMonth').innerText = monthText;

      const year = tutoriaDate.getFullYear();
      const month = tutoriaDate.getMonth();

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const grid = document.getElementById('tutoriaCalendarDays');
      grid.innerHTML = '';

      let startOffset = (firstDay === 0 ? 6 : firstDay - 1);
      for (let i = 0; i < startOffset; i++) { grid.innerHTML += `<div></div>`; }

      const allTutorias = getTutorias();

      for (let day = 1; day <= daysInMonth; day++) {
        const dateObj = new Date(year, month, day);
        const dateKey = formatDateKey(dateObj);
        
        const isSelected = dateKey === selectedTutoriaDayKey;
        const hasCitas = allTutorias.some(t => t.dateKey === dateKey);

        let bgClass = isSelected ? 'bg-purple-600 text-white font-bold' : 'bg-white text-slate-700 hover:bg-slate-100';

        grid.innerHTML += `
          <button onclick="selectTutoriaDay('${dateKey}')" class="p-2 rounded-xl border border-slate-100 relative flex flex-col items-center justify-center transition ${bgClass}">
            <span>${day}</span>
            ${hasCitas ? `<span class="w-1.5 h-1.5 ${isSelected ? 'bg-white' : 'bg-purple-600'} rounded-full mt-0.5"></span>` : ''}
          </button>
        `;
      }
    }

    function selectTutoriaDay(dateKey) {
      selectedTutoriaDayKey = dateKey;
      renderTutoriaCalendarGrid();
      renderDayCitas();
    }

    function renderDayCitas() {
      const [y, m, d] = selectedTutoriaDayKey.split('-');
      const formattedDate = new Date(y, m - 1, d).toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' });
      document.getElementById('selectedDayTitle').innerText = `Citas: ${formattedDate}`;

      const allTutorias = getTutorias();
      const dayCitas = allTutorias.filter(t => t.dateKey === selectedTutoriaDayKey);
      const container = document.getElementById('dayCitasList');

      if (dayCitas.length === 0) {
        container.innerHTML = `<p class="text-xs text-slate-400 italic text-center py-2">No hay tutorías citadas para este día.</p>`;
        return;
      }

      container.innerHTML = dayCitas.map(c => `
        <div onclick="openTutoriaDetailModal(${c.id})" class="p-3 bg-purple-50 border border-purple-100 rounded-xl flex justify-between items-center cursor-pointer hover:bg-purple-100/70 transition">
          <div class="space-y-0.5">
            <h5 class="font-bold text-slate-800 text-xs flex items-center gap-1.5">
              <i data-lucide="user-check" class="w-3.5 h-3.5 text-purple-600"></i> ${c.title}
            </h5>
            <p class="text-[10px] text-slate-500 line-clamp-1">${c.notes ? c.notes : 'Pulsa para añadir comentarios...'}</p>
          </div>
          <i data-lucide="chevron-right" class="w-4 h-4 text-purple-400"></i>
        </div>
      `).join('');
      lucide.createIcons();
    }

    function addTutoriaCita() {
      const titleInput = document.getElementById('tutoriaTitleInput');
      const title = titleInput.value.trim();
      if (!title) return;

      const allTutorias = getTutorias();
      const newCita = {
        id: Date.now(),
        dateKey: selectedTutoriaDayKey,
        title: title,
        notes: ''
      };

      allTutorias.unshift(newCita);
      saveTutorias(allTutorias);
      titleInput.value = '';
      
      renderTutoriaCalendarGrid();
      renderDayCitas();
    }

    function openTutoriaDetailModal(id) {
      activeTutoriaId = id;
      const allTutorias = getTutorias();
      const cita = allTutorias.find(t => t.id === id);
      if (!cita) return;

      const [y, m, d] = cita.dateKey.split('-');
      const formattedDate = new Date(y, m - 1, d).toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' });

      document.getElementById('tutoriaModalTitle').innerText = cita.title;
      document.getElementById('tutoriaModalDate').innerText = `Tutoría agendada para el ${formattedDate}`;
      document.getElementById('tutoriaModalNotes').value = cita.notes || '';

      document.getElementById('tutoriaDetailModal').classList.remove('hidden');
      lucide.createIcons();
    }

    function closeTutoriaDetailModal() {
      document.getElementById('tutoriaDetailModal').classList.add('hidden');
    }

    function saveTutoriaNotes() {
      if (!activeTutoriaId) return;

      const notes = document.getElementById('tutoriaModalNotes').value.trim();
      let allTutorias = getTutorias();

      allTutorias = allTutorias.map(t => {
        if (t.id === activeTutoriaId) {
          return { ...t, notes: notes };
        }
        return t;
      });

      saveTutorias(allTutorias);
      closeTutoriaDetailModal();
      renderDayCitas();
    }

    function deleteTutoria() {
      if (!activeTutoriaId) return;
      let allTutorias = getTutorias();
      allTutorias = allTutorias.filter(t => t.id !== activeTutoriaId);
      saveTutorias(allTutorias);
      closeTutoriaDetailModal();
      renderTutoriaCalendarGrid();
      renderDayCitas();
    }

    // ==================== FICHA INDIVIDUAL DE ALUMNO ====================
    function openStudentDetail(studentName) {
      currentStudent = studentName;
      document.getElementById('modalTitle').innerText = studentName;
      renderStudentProfile();
    }

    function renderStudentProfile() {
      const content = document.getElementById('modalContent');
      content.innerHTML = `
        <div class="space-y-5 pb-6">
          <div>
            <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Áreas de Observación (Subir Foto)</h4>
            <div class="grid grid-cols-3 gap-2">
              <button onclick="triggerUpload('Lógico-matemática')" class="p-2.5 bg-blue-50 border border-blue-100 text-blue-700 rounded-xl text-xs font-semibold flex flex-col items-center gap-1 active:scale-95 transition"><span>🧩</span> Log. Matemática</button>
              <button onclick="triggerUpload('Proyecto')" class="p-2.5 bg-amber-50 border border-amber-100 text-amber-700 rounded-xl text-xs font-semibold flex flex-col items-center gap-1 active:scale-95 transition"><span>🎨</span> Proyecto</button>
              <button onclick="triggerUpload('Lectoescritura')" class="p-2.5 bg-purple-50 border border-purple-100 text-purple-700 rounded-xl text-xs font-semibold flex flex-col items-center gap-1 active:scale-95 transition"><span>✏️</span> Lectoescritura</button>
              <button onclick="triggerUpload('Patio')" class="p-2.5 bg-emerald-50 border border-emerald-100 text-emerald-700 rounded-xl text-xs font-semibold flex flex-col items-center gap-1 active:scale-95 transition"><span>🛝</span> Patio</button>
              <button onclick="triggerUpload('Comedor')" class="p-2.5 bg-rose-50 border border-rose-100 text-rose-700 rounded-xl text-xs font-semibold flex flex-col items-center gap-1 active:scale-95 transition"><span>🍽️</span> Comedor</button>
            </div>
          </div>

          <div class="bg-slate-50 p-3.5 rounded-2xl border border-slate-200">
            <h4 class="text-xs font-bold text-slate-700 uppercase tracking-wider mb-2 flex items-center gap-1"><i data-lucide="notebook-pen" class="w-4 h-4 text-indigo-600"></i> Bloc de Notas</h4>
            <textarea id="studentNoteInput" placeholder="Anota aquí observaciones rápidas de ${currentStudent}..." class="w-full p-2.5 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-indigo-500 outline-none h-20 resize-none bg-white mb-2"></textarea>
            <button onclick="saveStudentNote()" class="w-full bg-indigo-600 text-white font-semibold py-2 rounded-xl text-xs hover:bg-indigo-700 transition">Guardar Nota</button>
            <div id="studentNotesList" class="mt-3 space-y-2 max-h-40 overflow-y-auto"></div>
          </div>

          <div>
            <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Galería de Evidencias</h4>
            <div id="studentGallery" class="grid grid-cols-2 gap-2"></div>
          </div>
        </div>`;

      loadStudentNotes();
      loadStudentGallery();
      lucide.createIcons();
    }

    function saveStudentNote() {
      const text = document.getElementById('studentNoteInput').value.trim();
      if (!text) return;
      const key = `notes_${currentStudent}`;
      const existing = JSON.parse(localStorage.getItem(key) || '[]');
      existing.unshift({
        id: Date.now(),
        text: text,
        date: new Date().toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })
      });
      localStorage.setItem(key, JSON.stringify(existing));
      document.getElementById('studentNoteInput').value = '';
      loadStudentNotes();
    }

    function loadStudentNotes() {
      const key = `notes_${currentStudent}`;
      const notes = JSON.parse(localStorage.getItem(key) || '[]');
      const container = document.getElementById('studentNotesList');
      if (notes.length === 0) {
        container.innerHTML = `<p class="text-xs text-slate-400 italic text-center py-2">Sin notas guardadas aún.</p>`;
        return;
      }
      container.innerHTML = notes.map(n => `
        <div class="bg-white p-2.5 rounded-xl border border-slate-100 shadow-sm relative group">
          <div class="flex justify-between items-center mb-1">
            <span class="text-[10px] font-semibold text-slate-400">${n.date}</span>
            <button onclick="deleteNote(${n.id})" class="text-slate-300 hover:text-rose-500"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
          </div>
          <p class="text-xs text-slate-700 leading-snug">${n.text}</p>
        </div>`).join('');
      lucide.createIcons();
    }

    function deleteNote(id) {
      const key = `notes_${currentStudent}`;
      let notes = JSON.parse(localStorage.getItem(key) || '[]');
      notes = notes.filter(n => n.id !== id);
      localStorage.setItem(key, JSON.stringify(notes));
      loadStudentNotes();
    }

    function triggerUpload(category) {
      selectedCategory = category;
      document.getElementById('uploadCategoryTitle').innerText = `Subir foto a ${category}`;
      document.getElementById('photoInput').value = '';
      document.getElementById('photoComment').value = '';
      document.getElementById('uploadModal').classList.remove('hidden');
    }

    function closeUploadModal() { document.getElementById('uploadModal').classList.add('hidden'); }

    function processAndSavePhoto() {
      const fileInput = document.getElementById('photoInput');
      const comment = document.getElementById('photoComment').value.trim();
      if (!fileInput.files || !fileInput.files[0]) { alert("Por favor selecciona una foto."); return; }

      const file = fileInput.files[0];
      const reader = new FileReader();

      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const maxDim = 600;
          let width = img.width;
          let height = img.height;

          if (width > height && width > maxDim) { height *= maxDim / width; width = maxDim; } 
          else if (height > maxDim) { width *= maxDim / height; height = maxDim; }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          const compressedBase64 = canvas.toDataURL('image/jpeg', 0.6);
          const key = `gallery_${currentStudent}`;
          const existing = JSON.parse(localStorage.getItem(key) || '[]');
          existing.unshift({
            id: Date.now(),
            category: selectedCategory,
            image: compressedBase64,
            comment: comment,
            date: new Date().toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit' })
          });

          localStorage.setItem(key, JSON.stringify(existing));
          closeUploadModal();
          loadStudentGallery();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function loadStudentGallery() {
      const key = `gallery_${currentStudent}`;
      const items = JSON.parse(localStorage.getItem(key) || '[]');
      const container = document.getElementById('studentGallery');
      if (items.length === 0) {
        container.innerHTML = `<p class="col-span-2 text-xs text-slate-400 italic text-center py-4">Sin fotos registradas aún.</p>`;
        return;
      }
      container.innerHTML = items.map(item => `
        <div class="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm flex flex-col justify-between">
          <div>
            <img src="${item.image}" class="w-full h-28 object-cover">
            <div class="p-2 space-y-1">
              <div class="flex items-center justify-between">
                <span class="text-[9px] font-bold px-1.5 py-0.5 rounded bg-indigo-50 text-indigo-600">${item.category}</span>
                <span class="text-[9px] text-slate-400">${item.date}</span>
              </div>
              ${item.comment ? `<p class="text-[11px] text-slate-600 leading-tight">${item.comment}</p>` : ''}
            </div>
          </div>
          <button onclick="deleteGalleryItem(${item.id})" class="p-1 text-center text-slate-300 hover:text-rose-500 border-t border-slate-100 text-[10px] w-full flex items-center justify-center gap-1">
            <i data-lucide="trash-2" class="w-3 h-3"></i> Eliminar
          </button>
        </div>`).join('');
      lucide.createIcons();
    }

    function deleteGalleryItem(id) {
      const key = `gallery_${currentStudent}`;
      let items = JSON.parse(localStorage.getItem(key) || '[]');
      items = items.filter(i => i.id !== id);
      localStorage.setItem(key, JSON.stringify(items));
      loadStudentGallery();
    }

    function closeSection() { document.getElementById('sectionModal').classList.add('hidden'); }
  </script>
</body>
</html>
