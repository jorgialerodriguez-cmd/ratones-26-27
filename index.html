<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuaderno de Tutoría - Aula Ratones</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Iconos Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 font-sans min-h-screen text-slate-800 flex flex-col justify-between max-w-md mx-auto relative shadow-2xl border-x border-slate-200">

  <!-- ==================== PANTALLA 1: LOGIN ==================== -->
  <div id="loginScreen" class="absolute inset-0 bg-indigo-600 z-50 flex flex-col items-center justify-center p-6 text-white">
    <div class="w-24 h-24 bg-white/20 rounded-full flex items-center justify-center mb-4 backdrop-blur-sm border-2 border-white/30 shadow-lg">
      <i data-lucide="user" class="w-12 h-12 text-white"></i>
    </div>
    <h1 class="text-2xl font-bold mb-1">¡Hola, Profe! 👋</h1>
    <p class="text-indigo-200 text-sm mb-6">Aula Ratones</p>

    <div class="w-full max-w-xs space-y-3">
      <input type="password" id="passwordInput" placeholder="Introduce tu contraseña" 
             class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-indigo-200 text-center text-lg focus:outline-none focus:ring-2 focus:ring-white">
      
      <button onclick="checkPassword()" 
              class="w-full bg-white text-indigo-600 font-semibold py-3 rounded-xl shadow-lg hover:bg-indigo-50 active:scale-95 transition">
        Entrar
      </button>
      <p id="errorMsg" class="text-xs text-rose-300 text-center hidden font-medium">Contraseña incorrecta. Prueba con 1234</p>
    </div>
  </div>

  <!-- ==================== PANTALLA 2: DASHBOARD PRINCIPAL ==================== -->
  <div id="mainApp" class="hidden flex-1 flex flex-col p-4 space-y-4">
    
    <!-- Encabezado con Ajustes -->
    <header class="flex justify-between items-center bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center font-bold">
          🐭
        </div>
        <div>
          <h2 class="font-bold text-slate-800 leading-tight">Aula Ratones</h2>
          <p class="text-xs text-slate-400">Cuaderno de Tutoría</p>
        </div>
      </div>
      <!-- Ruedecita de Ajustes -->
      <button onclick="openSection('Ajustes')" class="p-2 text-slate-400 hover:text-indigo-600 hover:bg-slate-50 rounded-xl transition">
        <i data-lucide="settings" class="w-6 h-6"></i>
      </button>
    </header>

    <!-- Calendario Mensual -->
    <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex-1 flex flex-col justify-between">
      <div class="flex justify-between items-center mb-3">
        <button onclick="changeMonth(-1)" class="p-1.5 hover:bg-slate-100 rounded-lg text-slate-600"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>
        <h3 id="calendarMonth" class="font-bold text-slate-700 capitalize"></h3>
        <button onclick="changeMonth(1)" class="p-1.5 hover:bg-slate-100 rounded-lg text-slate-600"><i data-lucide="chevron-right" class="w-5 h-5"></i></button>
      </div>

      <!-- Días de la semana -->
      <div class="grid grid-cols-7 text-center text-xs font-semibold text-slate-400 mb-2">
        <span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span><span>D</span>
      </div>

      <!-- Rejilla de días -->
      <div id="calendarDays" class="grid grid-cols-7 gap-1 text-center text-sm font-medium flex-1 items-center"></div>
    </section>

    <!-- Menú de Botones Cuadrados (Secciones) -->
    <footer class="grid grid-cols-2 gap-3 pt-1">
      <button onclick="openSection('Alumnos')" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center space-y-2 hover:border-indigo-300 hover:shadow-md active:scale-95 transition group">
        <div class="p-3 bg-blue-50 text-blue-600 rounded-xl group-hover:scale-110 transition">
          <i data-lucide="users" class="w-6 h-6"></i>
        </div>
        <span class="font-semibold text-sm text-slate-700">Alumnos</span>
      </button>

      <button onclick="openSection('Evaluación')" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center space-y-2 hover:border-indigo-300 hover:shadow-md active:scale-95 transition group">
        <div class="p-3 bg-emerald-50 text-emerald-600 rounded-xl group-hover:scale-110 transition">
          <i data-lucide="clipboard-check" class="w-6 h-6"></i>
        </div>
        <span class="font-semibold text-sm text-slate-700">Evaluación</span>
      </button>

      <button onclick="openSection('Tutorías')" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center space-y-2 hover:border-indigo-300 hover:shadow-md active:scale-95 transition group">
        <div class="p-3 bg-purple-50 text-purple-600 rounded-xl group-hover:scale-110 transition">
          <i data-lucide="calendar-heart" class="w-6 h-6"></i>
        </div>
        <span class="font-semibold text-sm text-slate-700">Tutorías</span>
      </button>

      <button onclick="openSection('Programación')" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center space-y-2 hover:border-indigo-300 hover:shadow-md active:scale-95 transition group">
        <div class="p-3 bg-amber-50 text-amber-600 rounded-xl group-hover:scale-110 transition">
          <i data-lucide="book-open" class="w-6 h-6"></i>
        </div>
        <span class="font-semibold text-sm text-slate-700">Programación</span>
      </button>
    </footer>
  </div>

  <!-- ==================== VISTA MODAL / SECCIÓN ABIERTA ==================== -->
  <div id="sectionModal" class="hidden absolute inset-0 bg-white z-40 flex flex-col p-4">
    <div class="flex items-center justify-between pb-3 border-b border-slate-100 mb-4">
      <button onclick="closeSection()" class="flex items-center text-sm font-semibold text-slate-500 hover:text-indigo-600">
        <i data-lucide="arrow-left" class="w-5 h-5 mr-1"></i> Volver
      </button>
      <h3 id="modalTitle" class="font-bold text-lg text-slate-800"></h3>
      <div class="w-5"></div>
    </div>
    <div id="modalContent" class="flex-1 overflow-y-auto">
      <!-- El contenido específico de cada sección irá cargándose aquí -->
    </div>
  </div>

  <script>
    // Inicializar iconos
    lucide.createIcons();

    // Contraseña por defecto (puedes cambiarla aquí)
    const SECRET = "1234";

    function checkPassword() {
      const pwd = document.getElementById('passwordInput').value;
      if (pwd === SECRET) {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('mainApp').classList.remove('hidden');
        renderCalendar();
      } else {
        document.getElementById('errorMsg').classList.remove('hidden');
      }
    }

    // Lógica del Calendario
    let currentDate = new Date();

    function renderCalendar() {
      const monthText = currentDate.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' });
      document.getElementById('calendarMonth').innerText = monthText;

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      
      const grid = document.getElementById('calendarDays');
      grid.innerHTML = '';

      // Offset para empezar en Lunes (0) en vez de Domingo
      let startOffset = (firstDay === 0 ? 6 : firstDay - 1);

      for (let i = 0; i < startOffset; i++) {
        grid.innerHTML += `<div></div>`;
      }

      const today = new Date();
      for (let day = 1; day <= daysInMonth; day++) {
        const isToday = today.getDate() === day && today.getMonth() === month && today.getFullYear() === year;
        const activeClass = isToday ? 'bg-indigo-600 text-white font-bold rounded-xl shadow-md' : 'text-slate-700 hover:bg-slate-100 rounded-lg';
        grid.innerHTML += `<div class="p-2 cursor-pointer transition ${activeClass}">${day}</div>`;
      }
    }

    function changeMonth(delta) {
      currentDate.setMonth(currentDate.getMonth() + delta);
      renderCalendar();
    }

    // Navegación de Secciones
    function openSection(name) {
      document.getElementById('modalTitle').innerText = name;
      document.getElementById('modalContent').innerHTML = `
        <div class="flex flex-col items-center justify-center h-64 text-center p-6 bg-slate-50 rounded-2xl border border-dashed border-slate-200">
          <div class="p-4 bg-indigo-50 text-indigo-600 rounded-full mb-3">
            <i data-lucide="wrench" class="w-8 h-8"></i>
          </div>
          <h4 class="font-bold text-slate-700 mb-1">Sección de ${name}</h4>
          <p class="text-sm text-slate-400">¡Lista para construir! Dime qué quieres meter aquí.</p>
        </div>
      `;
      document.getElementById('sectionModal').classList.remove('hidden');
      lucide.createIcons();
    }

    function closeSection() {
      document.getElementById('sectionModal').classList.add('hidden');
    }
  </script>
</body>
</html>
