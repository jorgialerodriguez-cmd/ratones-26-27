<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plataforma Docente</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    
    .card { background: white; padding: 2.5rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 700px; text-align: center; }
    .hidden { display: none !important; }

    /* Estilos Login */
    .form-group { margin-bottom: 1.2rem; text-align: left; }
    .form-group label { display: block; margin-bottom: .4rem; font-weight: 600; color: #334155; }
    .form-group input { width: 100%; padding: .75rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem; }
    .btn-login { background: #2563eb; color: white; border: none; padding: .8rem; border-radius: 6px; font-size: 1rem; font-weight: bold; width: 100%; cursor: pointer; margin-top: 1rem; }

    /* Estilos Panel Principal */
    .grid-dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-top: 1.5rem; }
    .btn-modulo { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1.25rem; border: none; border-radius: 10px; color: white; font-size: 1rem; font-weight: 600; cursor: pointer; transition: transform 0.2s; }
    .btn-modulo:hover { transform: translateY(-3px); }
    .btn-modulo .icon { font-size: 2rem; margin-bottom: .5rem; }

    /* Colores por botón */
    .bg-alumnos      { background-color: #0284c7; }
    .bg-evaluacion   { background-color: #7c3aed; }
    .bg-tutorias     { background-color: #db2777; }
    .bg-programacion { background-color: #d97706; }
    .bg-extraes      { background-color: #10b981; } /* Nuevo */
    .bg-pagos        { background-color: #0f172a; } /* Nuevo */
  </style>
</head>
<body>

  <!-- PANTALLA 1: PERFIL DE PROFESORA (LOGIN) -->
  <div id="pantalla-login" class="card">
    <h2 style="margin-bottom: .5rem; color: #0f172a;">Perfil de Profesora</h2>
    <p style="margin-bottom: 1.5rem; color: #64748b;">Ingresa tu usuario y contraseña</p>
    
    <form onsubmit="ingresar(event)">
      <div class="form-group">
        <label>Usuario / Email</label>
        <input type="text" placeholder="profesora@colegio.com" required>
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-login">Inicia Sesión</button>
    </form>
  </div>

  <!-- PANTALLA 2: PÁGINA PRINCIPAL (DASHBOARD) -->
  <div id="pantalla-principal" class="card hidden">
    <h2 style="color: #0f172a; margin-bottom: 1.5rem;">Página Principal</h2>
    
    <div class="grid-dashboard">
      <!-- Botones Originales -->
      <button class="btn-modulo bg-alumnos" onclick="navegar('/alumnos')">
        <span class="icon">👨‍🎓</span><span>Alumnos</span>
      </button>

      <button class="btn-modulo bg-evaluacion" onclick="navegar('/evaluacion')">
        <span class="icon">📊</span><span>Evaluación</span>
      </button>

      <button class="btn-modulo bg-tutorias" onclick="navegar('/tutorias')">
        <span class="icon">💬</span><span>Tutorías</span>
      </button>

      <button class="btn-modulo bg-programacion" onclick="navegar('/programacion')">
        <span class="icon">📚</span><span>Programación</span>
      </button>

      <!-- Botones Nuevos -->
      <button class="btn-modulo bg-extraes" onclick="navegar('/extraescolares')">
        <span class="icon">⚽</span><span>Extraescolares</span>
      </button>

      <button class="btn-modulo bg-pagos" onclick="navegar('/pagos')">
        <span class="icon">💳</span><span>Pagos</span>
      </button>
    </div>
  </div>

  <script>
    function ingresar(event) {
      event.preventDefault(); // Evita recargar la página
      document.getElementById('pantalla-login').classList.add('hidden');
      document.getElementById('pantalla-principal').classList.remove('hidden');
    }

    function navegar(ruta) {
      console.log('Navegando a:', ruta);
      // Aquí colocas la redirección real cuando la conectes a tu servidor:
      // window.location.href = ruta;
    }
  </script>

</body>
</html>
