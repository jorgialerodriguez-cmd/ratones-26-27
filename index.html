<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuaderno de Tutoría - Ratones 26/27</title>
  <!-- Tailwind CSS para estilos rápidos y bonitos -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans p-4 max-w-md mx-auto min-h-screen">
  
  <header class="mb-6 text-center">
    <h1 class="text-2xl font-bold text-indigo-600">🐭 Aula Ratones 26/27</h1>
    <p class="text-sm text-slate-500">Cuaderno de Tutoría y Observación</p>
  </header>

  <!-- Selector de Alumno -->
  <section class="bg-white p-4 rounded-xl shadow-sm mb-4 border border-slate-100">
    <label class="block text-sm font-semibold text-slate-700 mb-2">Seleccionar Alumno</label>
    <select id="studentSelect" class="w-full p-2.5 border rounded-lg bg-slate-50 text-slate-800 focus:ring-2 focus:ring-indigo-500 outline-none">
      <option value="Lucas M.">Lucas M.</option>
      <option value="Sofía R.">Sofía R.</option>
      <option value="Mateo G.">Mateo G.</option>
      <option value="Martina L.">Martina L.</option>
    </select>
  </section>

  <!-- Captura Rápida de Notas -->
  <section class="bg-white p-4 rounded-xl shadow-sm mb-4 border border-slate-100">
    <label class="block text-sm font-semibold text-slate-700 mb-2">Nueva Anotación</label>
    <textarea id="noteText" class="w-full p-3 border rounded-lg h-24 text-slate-800 focus:ring-2 focus:ring-indigo-500 outline-none placeholder:text-slate-400" placeholder="Escribe lo ocurrido hoy..."></textarea>
    
    <button onclick="saveNote()" class="w-full mt-3 bg-indigo-600 text-white py-2.5 rounded-lg font-semibold hover:bg-indigo-700 transition">
      Guardar Nota
    </button>
  </section>

  <!-- Historial de Observaciones -->
  <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
    <h2 class="text-sm font-semibold text-slate-700 mb-3">Observaciones de Hoy</h2>
    <div id="notesList" class="space-y-2 text-sm text-slate-600">
      <p class="text-xs text-slate-400 italic">No hay notas guardadas todavía.</p>
    </div>
  </section>

  <script>
    function saveNote() {
      const student = document.getElementById('studentSelect').value;
      const text = document.getElementById('noteText').value;
      if (!text.trim()) return;

      const notesList = document.getElementById('notesList');
      const time = new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
      
      if (notesList.querySelector('p.italic')) notesList.innerHTML = '';

      const card = document.createElement('div');
      card.className = "p-3 bg-slate-50 rounded-lg border border-slate-100";
      card.innerHTML = `<div class="flex justify-between font-medium text-slate-800"><span>${student}</span><span class="text-xs text-slate-400">${time}</span></div><p class="mt-1 text-slate-600">${text}</p>`;
      
      notesList.prepend(card);
      document.getElementById('noteText').value = '';
    }
  </script>

</body>
</html>
