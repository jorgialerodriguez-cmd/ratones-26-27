<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Principal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .dashboard-container {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      max-width: 600px;
      width: 100%;
      text-align: center;
    }

    .dashboard-title {
      margin-bottom: 24px;
      color: #1e293b;
      font-size: 1.5rem;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
    }

    .btn-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      border: none;
      border-radius: 10px;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
    }

    .btn-card .icon {
      font-size: 2rem;
      margin-bottom: 8px;
    }

    /* Estilos específicos */
    .btn-extraescolares {
      background-color: #10b981; /* Verde dinámico */
    }

    .btn-pagos {
      background-color: #2563eb; /* Azul corporativo */
    }

    .btn-evaluacion {
      background-color: #94a3b8; /* Gris neutro (pausado) */
      opacity: 0.7;
      cursor: not-allowed;
    }

    .btn-evaluacion:hover {
      transform: none;
      box-shadow: none;
    }
  </style>
</head>
<body>

  <div class="dashboard-container">
    <h1 class="dashboard-title">Panel Principal</h1>
    
    <div class="dashboard-grid">
      <!-- Botón Extraescolares -->
      <button class="btn-card btn-extraescolares" onclick="navegar('/extraescolares')">
        <span class="icon">⚽</span>
        <span>Extraescolares</span>
      </button>

      <!-- Botón Pagos -->
      <button class="btn-card btn-pagos" onclick="navegar('/pagos')">
        <span class="icon">💳</span>
        <span>Pagos</span>
      </button>

      <!-- Botón Evaluación (Pausado temporalmente) -->
      <button class="btn-card btn-evaluacion" title="Módulo pendiente" disabled>
        <span class="icon">📊</span>
        <span>Evaluación</span>
      </button>
    </div>
  </div>

  <script>
    function navegar(ruta) {
      // Sustituir por la URL o ruta real de tu servidor
      console.log('Redirigiendo a:', ruta);
      window.location.href = ruta;
    }
  </script>

</body>
</html>
