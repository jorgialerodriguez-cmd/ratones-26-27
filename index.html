<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página Principal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .dashboard-container {
      background: #ffffff;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      max-width: 900px;
      width: 100%;
      text-align: center;
    }

    .dashboard-title {
      margin-bottom: 28px;
      color: #0f172a;
      font-size: 1.75rem;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
    }

    .btn-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 22px 15px;
      border: none;
      border-radius: 12px;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.12);
    }

    .btn-card .icon {
      font-size: 2.2rem;
      margin-bottom: 10px;
    }

    /* Colores para cada sección */
    .btn-calendario   { background-color: #2563eb; }
    .btn-alumnos      { background-color: #0284c7; }
    .btn-evaluacion   { background-color: #7c3aed; }
    .btn-tutorias     { background-color: #db2777; }
    .btn-programacion { background-color: #d97706; }
    .btn-extraes      { background-color: #10b981; } /* Nuevo */
    .btn-pagos        { background-color: #0f172a; } /* Nuevo */
  </style>
</head>
<body>

  <div class="dashboard-container">
    <h1 class="dashboard-title">Página Principal</h1>
    
    <div class="dashboard-grid">
      <!-- Botones Originales -->
      <button class="btn-card btn-calendario" onclick="navegar('/calendario')">
        <span class="icon">📅</span>
        <span>Calendario</span>
      </button>

      <button class="btn-card btn-alumnos" onclick="navegar('/alumnos')">
        <span class="icon">👨‍🎓</span>
        <span>Alumnos</span>
      </button>

      <button class="btn-card btn-evaluacion" onclick="navegar('/evaluacion')">
        <span class="icon">📊</span>
        <span>Evaluación</span>
      </button>

      <button class="btn-card btn-tutorias" onclick="navegar('/tutorias')">
        <span class="icon">💬</span>
        <span>Tutorías</span>
      </button>

      <button class="btn-card btn-programacion" onclick="navegar('/programacion')">
        <span class="icon">📚</span>
        <span>Programación</span>
      </button>

      <!-- Botones Nuevos -->
      <button class="btn-card btn-extraes" onclick="navegar('/extraescolares')">
        <span class="icon">⚽</span>
        <span>Extraescolares</span>
      </button>

      <button class="btn-card btn-pagos" onclick="navegar('/pagos')">
        <span class="icon">💳</span>
        <span>Pagos</span>
      </button>
    </div>
  </div>

  <script>
    function navegar(ruta) {
      console.label = 'Redirigiendo a: ' + ruta;
      window.location.href = ruta;
    }
  </script>

</body>
</html>
